
name: Health Data Quality Check

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  data-quality:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run data quality checks
        run: python scripts/check_data_quality.py
