
name: Health Data Quality Check

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  data-quality:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run data quality checks
        run: python scripts/check_data_quality.py

      - name: Upload data quality reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: health-data-quality-reports
          path: reports/
          if-no-files-found: warn
          retention-days: 30
